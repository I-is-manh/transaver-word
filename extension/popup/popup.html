<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Transaver Word</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img id="wordmark" src="../icons/wordmark.svg" alt="Transaver Word" height="26" />
      <div class="appearance" role="radiogroup" aria-label="Giao diện sáng/tối">
        <label title="Theo hệ thống">
          <input type="radio" name="appearance" value="system" aria-label="Theo hệ thống" />
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="12" rx="2" /><path d="M9 20h6M12 16.5V20" /></svg></span>
        </label>
        <label title="Sáng">
          <input type="radio" name="appearance" value="light" aria-label="Sáng" />
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg></span>
        </label>
        <label title="Tối">
          <input type="radio" name="appearance" value="dark" aria-label="Tối" />
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg></span>
        </label>
      </div>
    </header>

    <section class="langs" aria-label="Cặp ngôn ngữ">
      <label>
        <span class="label">Dịch từ (A)</span>
        <select id="src"></select>
      </label>
      <button id="swap" type="button" title="Đổi chiều dịch" aria-label="Đổi chiều dịch"></button>
      <label>
        <span class="label">Sang (B)</span>
        <select id="tgt"></select>
      </label>
    </section>
    <p id="saved" class="hint" aria-live="polite"></p>

    <section class="quick">
      <textarea id="input" rows="3" placeholder="Nhập hoặc dán văn bản cần dịch…" maxlength="500"></textarea>
      <div class="row">
        <span id="count" class="hint">0/500</span>
        <button id="translate" type="button" class="primary">Dịch</button>
      </div>
      <div id="result" aria-live="polite" hidden></div>
    </section>

    <label class="toggle">
      <input id="showIcon" type="checkbox" />
      <span>Hiện icon dịch khi bôi đen văn bản</span>
    </label>
    <label class="toggle toggle-next">
      <input id="highlight" type="checkbox" />
      <span>Gạch chân từ đã lưu khi lướt web</span>
    </label>

    <section id="account" class="account" aria-label="Tài khoản">
      <div id="accountLoading" class="hint">Đang kiểm tra kết nối…</div>

      <div id="accountIn" class="account-in" hidden>
        <div class="account-who">
          <span class="label">Đã kết nối tài khoản</span>
          <span id="accountEmail" class="account-email"></span>
        </div>
        <button id="openWebIn" type="button" class="secondary">Mở Transaver</button>
      </div>

      <div id="accountOut" class="account-out" hidden>
        <p class="hint-text">Mở trang Transaver Word và đăng nhập ở đó, extension sẽ tự kết nối để lưu từ.</p>
        <button id="openWebOut" type="button" class="primary">Mở Transaver Word</button>
      </div>
    </section>

    <script src="../src/config.js"></script>
    <script src="../src/icons.js"></script>
    <script src="../src/appearance.js"></script>
    <script src="../src/languages.js"></script>
    <script src="popup.js"></script>
    <script src="account.js"></script>
    <script src="appearance.js"></script>
  </body>
</html>
